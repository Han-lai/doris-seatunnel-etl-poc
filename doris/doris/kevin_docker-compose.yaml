version: "3"
services:
  fe:
    image: apache/doris:2.0.0_alpha-fe-x86_64

    hostname: fe
    environment:
     - FE_SERVERS=fe1:172.20.80.2:9010
     - FE_ID=1
    ports:
      - 9031:8030
      - 9030:9030
    volumes:
     - /mnt/data/doris/fe/doris-meta/:/opt/apache-doris/fe/doris-meta/
     - /mnt/data/doris/fe/log/:/opt/apache-doris/fe/log/
    networks:
       doris_net:
         ipv4_address: 172.20.80.2

  be:
    image: apache/doris:2.0.0_alpha-be-x86_64

    hostname: be
    environment:
     - FE_SERVERS=fe1:172.20.80.2:9010
     - BE_ADDR=172.20.80.3:9050
    ports:
      - 8040:8040
    volumes:
     - /mnt/data/doris/be/storage/:/opt/apache-doris/be/storage/
     - /mnt/data/doris/be/script/:/docker-entrypoint-initdb.d/
    depends_on:
      - fe
    networks:
       doris_net:
         ipv4_address: 172.20.80.3

networks:
   doris_net:
     ipam:
       config:
         - subnet: 172.20.0.0/16
