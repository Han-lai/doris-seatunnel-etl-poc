# Set the basic configuration of the task to be performed
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Clickhouse {
    host = "<clickhouse-host>:8123"
    database = "EAP"
    sql = "SELECT * FROM PK_MessageBody_data LIMIT 1000"

    username = "default"
    password = "default"
    server_time_zone = "UTC"
    clickhouse.config = {
      "socket_timeout" = "300000"
    }
  }
}

sink {
    Doris {
        fenodes = "<doris-fe-host>:8030"
        username = "root"
        password = ""
        database = "test"
        schema_save_mode = "RECREATE_SCHEMA"
        table = "PK_MessageBody_data"
        data_save_mode = "APPEND_DATA"
        sink.enable-2pc = "true"
        sink.label-prefix = "test_json"
        save_mode_create_template = """
        CREATE TABLE IF NOT EXISTS `${database}`.PK_MessageBody_data (
        TimeStamp Datetime,
          ${rowtype_fields},
          MessageBody VARIANT
        ) ENGINE=OLAP
        UNIQUE KEY (TimeStamp)
        DISTRIBUTED BY HASH (TimeStamp)
        PROPERTIES (
          "replication_allocation" = "tag.location.default: 1",
          "in_memory" = "false",
          "storage_format" = "V2",
          "disable_auto_compaction" = "false"
        )"""
        doris.config = {
            format = "json"
            read_json_by_line = "true"
        }
    }
}


