  job_submitter:
    image: seatunnel:2.3.5
    environment:
      - JAVA_OPTS=-Xms2G -Xmx2G
      - SEATUNNEL_HOME=/opt/seatunnel
      - SEATUNNEL_VERSION=2.3.5   
    volumes:
      - ./server/config:/opt/seatunnel/config
    entrypoint: |
      sh -c '
        if [ ! -f /opt/seatunnel/lib/mysql-connector-j-8.0.31.jar ]; then
          echo "mysql-connector-j-8.0.31.jar not found, downloading..."
          wget -P /opt/seatunnel/lib https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.0.31/mysql-connector-j-8.0.31.jar
        else
          echo "mysql-connector-j-8.0.31.jar already exists."
        fi
        /opt/seatunnel/bin/seatunnel.sh --config /opt/seatunnel/config/ck_doris.configck_doris.config
      '
    depends_on:
      - seatunnel
    networks:
      - seatunnel-network


