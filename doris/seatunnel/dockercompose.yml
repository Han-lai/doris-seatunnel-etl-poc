services:
  seatunnel:
    image: seatunnel:2.3.5
    environment:
      - JAVA_OPTS=-Xms2G -Xmx2G
      - SEATUNNEL_HOME=/opt/seatunnel
      - SEATUNNEL_VERSION=2.3.5 
    ports:
      - "9801:5801"
    volumes:
      - ./server/config:/opt/seatunnel/config
      - ./logs:/opt/seatunnel/logs
    command: ["/bin/sh", "-c", "/opt/seatunnel/bin/seatunnel-cluster.sh -DJvmOption=-Xms2G -Xmx2G"]
    # deploy:
    #   mode: replicated
    #   replicas: 3
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 4G
    #     reservations:
    #       cpus: '1'
    #       memory: 2G
    networks:
      - seatunnel-network

