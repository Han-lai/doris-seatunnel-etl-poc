
env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10000
}

source {
  Kafka {
    result_table_name = "fake"
    schema = {
      fields {
        Timestamp = timestamp
        Topic = string
        Partition = int
        Offset = long
        SchemaId = string
        SchemaType = string
        Key = string
        OWNER = string
        TABLE = string
        OP = string
        scn = string
        train_id = string
        train_seq = string
        rowid = string
        load_seq = string
        DBNAME = string
        columnsBefore = string
        columnsAfter = string
      }
    }
    format = json
    topic = "MES-IT__WJIAMES__WJ_IA__POC__R_SN_CNF_T"
    bootstrap.servers = "<kafka-broker-1>:9092,<kafka-broker-2>:9092,<kafka-broker-3>:9092"
    kafka.config = {
      client.id = client_1
      max.poll.records = 1000
      auto.offset.reset = "earliest"
      security.protocol=SASL_PLAINTEXT
      sasl.mechanism=PLAIN
      sasl.jaas.config="org.apache.kafka.common.security.scram.ScramLoginModule required username=\"<KAFKA_USERNAME>\" password=\"<KAFKA_PASSWORD>\";"
    }
  }  
}

transform {
  Sql {
    source_table_name = "fake"  # Ensure this is the correct source table from the Kafka plugin
    result_table_name = "fake1" # Result table after SQL transformation
    query = """
      select 
        current_timestamp as ts,
        scn,
        train_id,
        train_seq,
        OWNER as owner,
        `TABLE` as `table`,
        OP as op,
        rowid,
        load_seq,
        DBNAME as dbname,
        columnsBefore,
        columnsAfter
      from fake
    """
  }
}

sink {
  Console {}
}

sink {
  Doris {
    source_table_name = "fake1"  # This should match the transformed result table
    doris.batch.size = 1024
    fenodes = "<doris-fe-host>:8030"
    username = "root"
    password = ""
    database = "test_variant"
    table = "wj_c11_wjadpmes__wj_adp__poc__r_sn_cnf_t"
    sink.label-prefix = "wj-test"
    sink.enable-delete = "true"
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    save_mode_create_template = """
    CREATE TABLE IF NOT EXISTS `${database}`.`${table_name}` (
    ${rowtype_fields}
    ) ENGINE=OLAP
    UNIQUE KEY (ts,scn)
    DISTRIBUTED BY HASH (scn)
    PROPERTIES (
    "replication_allocation" = "tag.location.default: 1",
    "in_memory" = "false",
    "storage_format" = "V2",
    "disable_auto_compaction" = "false"
    )"""
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}


